<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <title>PiP Player</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      background: #0b0d10;
      color: #fff;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    main {
      width: min(100%, 680px);
      display: grid;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 48px);
      letter-spacing: -0.04em;
    }
    p {
      margin: 0;
      color: #b7bec8;
      line-height: 1.6;
    }
    .card {
      background: #15191f;
      border: 1px solid #2a3038;
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.28);
    }
    video, .youtube-player {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      object-fit: contain;
    }
    .youtube-player { border: 0; display: none; }
    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    button, .file-label {
      appearance: none;
      border: 0;
      border-radius: 14px;
      min-height: 50px;
      padding: 0 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    button {
      background: #fff;
      color: #0b0d10;
    }
    button.secondary, .file-label {
      background: #252b33;
      color: #fff;
    }
    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }
    .url-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 14px; }
    .url-row input {
      min-width: 0; min-height: 50px; border: 1px solid #343b45; border-radius: 14px;
      padding: 0 14px; background: #0f1216; color: #fff; font: inherit;
    }
    .url-row input::placeholder { color: #747f8d; }
    input[type=file] {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .status {
      font-size: 14px;
      color: #99a3af;
      min-height: 1.5em;
    }
    .note {
      font-size: 13px;
      color: #7f8a98;
    }
    @media (max-width: 520px) {
      .controls, .url-row { grid-template-columns: 1fr; }
      body { padding: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>PiP Player</h1>
      <p>選一段影片後播放，再按「開啟 PiP」。回到手機主畫面時，支援的瀏覽器會以子母畫面繼續播放。</p>
    </div>

    <section class="card">
      <video id="video" controls playsinline preload="metadata"></video>
      <iframe id="youtubePlayer" class="youtube-player" title="YouTube player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>

      <div class="url-row">
        <input id="videoUrl" type="url" inputmode="url" autocomplete="url" placeholder="貼上影片網址，例如 https://example.com/video.mp4" />
        <button id="loadUrlBtn" type="button">載入網址</button>
      </div>

      <div class="controls">
        <label class="file-label" for="fileInput">選擇影片</label>
        <input id="fileInput" type="file" accept="video/*" />

        <button id="playBtn" class="secondary" type="button" disabled>播放 / 暫停</button>
        <button id="pipBtn" type="button" disabled>開啟 PiP</button>
        <button id="fullBtn" class="secondary" type="button" disabled>全螢幕</button>
      </div>
    </section>

    <p id="status" class="status">尚未選擇影片。</p>
    <p class="note">提示：PiP 是否可用由瀏覽器與手機系統決定。iPhone / iPad Safari 通常可使用系統子母畫面；部分瀏覽器可能要求先由使用者手動播放影片。</p>
  </main>

  <script>
    const video = document.getElementById('video');
    const youtubePlayer = document.getElementById('youtubePlayer');
    const fileInput = document.getElementById('fileInput');
    const videoUrl = document.getElementById('videoUrl');
    const loadUrlBtn = document.getElementById('loadUrlBtn');
    const playBtn = document.getElementById('playBtn');
    const pipBtn = document.getElementById('pipBtn');
    const fullBtn = document.getElementById('fullBtn');
    const status = document.getElementById('status');

    let objectUrl = '';

    function setStatus(message) {
      status.textContent = message;
    }

    function hasStandardPiP() {
      return 'pictureInPictureEnabled' in document &&
             document.pictureInPictureEnabled &&
             typeof video.requestPictureInPicture === 'function';
    }

    function hasWebkitPresentationMode() {
      return typeof video.webkitSetPresentationMode === 'function' &&
             typeof video.webkitSupportsPresentationMode === 'function' &&
             video.webkitSupportsPresentationMode('picture-in-picture');
    }

    function updatePiPButton() {
      if (pipBtn.dataset.mode === 'youtube') return;
      const supported = hasStandardPiP() || hasWebkitPresentationMode();
      pipBtn.disabled = !video.src || !supported;

      const inStandardPiP = document.pictureInPictureElement === video;
      const inWebkitPiP = video.webkitPresentationMode === 'picture-in-picture';

      pipBtn.textContent = (inStandardPiP || inWebkitPiP) ? '退出 PiP' : '開啟 PiP';

      if (video.src && !supported) {
        setStatus('這個瀏覽器目前沒有提供網頁 PiP API。可嘗試 Safari / Chrome，或使用播放器內建的子母畫面按鈕。');
      }
    }

    function getYouTubeId(value) {
      try {
        const u = new URL(value);
        const host = u.hostname.replace(/^www\./, '');
        if (host === 'youtu.be') return u.pathname.split('/').filter(Boolean)[0] || '';
        if (host === 'youtube.com' || host === 'm.youtube.com') {
          if (u.pathname === '/watch') return u.searchParams.get('v') || '';
          const m = u.pathname.match(/^\/(?:shorts|embed|live)\/([^/?#]+)/);
          return m ? m[1] : '';
        }
      } catch (_) {}
      return '';
    }

    function showNativeVideo() {
      youtubePlayer.style.display = 'none';
      youtubePlayer.src = '';
      video.style.display = 'block';
    }

    function showYouTube(id) {
      video.pause();
      video.removeAttribute('src');
      video.load();
      video.style.display = 'none';
      youtubePlayer.style.display = 'block';
      const origin = encodeURIComponent(location.origin);
      youtubePlayer.src = 'https://www.youtube.com/embed/' + encodeURIComponent(id) +
        '?playsinline=1&enablejsapi=1&origin=' + origin + '&autoplay=0';
      playBtn.disabled = true;
      pipBtn.disabled = false;
      pipBtn.textContent = 'YouTube PiP';
      pipBtn.dataset.mode = 'youtube';
      fullBtn.disabled = true;
      setStatus('YouTube 已載入。先在播放器中播放，再按「YouTube PiP」查看手機上的 PiP 操作方式。');
    }

    function enablePlayer() {
      pipBtn.dataset.mode = 'native';
      playBtn.disabled = false;
      fullBtn.disabled = false;
      updatePiPButton();
    }

    loadUrlBtn.addEventListener('click', () => {
      const url = videoUrl.value.trim();
      if (!url) {
        setStatus('請先貼上影片網址。');
        return;
      }
      try {
        const parsed = new URL(url);
        if (!/^https?:$/.test(parsed.protocol)) throw new Error('網址必須使用 http 或 https');
        if (objectUrl) {
          URL.revokeObjectURL(objectUrl);
          objectUrl = '';
        }
        const youtubeId = getYouTubeId(parsed.href);
        if (youtubeId) {
          showYouTube(youtubeId);
          return;
        }
        showNativeVideo();
        video.src = parsed.href;
        video.load();
        enablePlayer();
        setStatus('已載入影片網址。若無法播放，來源網站可能禁止跨站播放，或網址不是直接影片檔。');
      } catch (error) {
        setStatus('影片網址無效：' + (error.message || error));
      }
    });

    videoUrl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') loadUrlBtn.click();
    });

    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;

      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);
      showNativeVideo();
      video.src = objectUrl;
      video.load();

      enablePlayer();
      setStatus('已載入：' + file.name + '。請先播放影片，再開啟 PiP。');
    });

    playBtn.addEventListener('click', async () => {
      try {
        if (video.paused) {
          await video.play();
          setStatus('影片播放中。現在可以開啟 PiP。');
        } else {
          video.pause();
          setStatus('影片已暫停。');
        }
      } catch (error) {
        setStatus('無法播放：' + (error.message || error));
      }
    });

    pipBtn.addEventListener('click', async () => {
      if (pipBtn.dataset.mode === 'youtube') {
        const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isAndroid = /Android/i.test(navigator.userAgent);
        if (isiOS) {
          setStatus('YouTube 模式：先播放影片並嘗試全螢幕，再點播放器/系統提供的子母畫面按鈕，或播放後回主畫面。網頁無法直接控制 YouTube iframe 的 PiP。');
        } else if (isAndroid) {
          setStatus('YouTube 模式：先播放影片，再使用播放器或瀏覽器提供的 PiP；部分 Android 裝置可在播放時回主畫面觸發。網頁無法直接控制 YouTube iframe 的 PiP。');
        } else {
          setStatus('YouTube 是跨來源 iframe，這個網頁不能直接呼叫其中影片的 PiP。請使用 YouTube 播放器或瀏覽器提供的 PiP 功能。');
        }
        return;
      }
      try {
        if (video.paused) {
          await video.play();
        }

        if (hasStandardPiP()) {
          if (document.pictureInPictureElement === video) {
            await document.exitPictureInPicture();
          } else {
            await video.requestPictureInPicture();
          }
        } else if (hasWebkitPresentationMode()) {
          const nextMode = video.webkitPresentationMode === 'picture-in-picture'
            ? 'inline'
            : 'picture-in-picture';
          video.webkitSetPresentationMode(nextMode);
        } else {
          setStatus('目前瀏覽器不支援由網頁直接啟動 PiP。');
        }
      } catch (error) {
        setStatus('PiP 啟動失敗：' + (error.message || error));
      }

      updatePiPButton();
    });

    fullBtn.addEventListener('click', async () => {
      try {
        if (video.requestFullscreen) {
          await video.requestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        } else {
          setStatus('這個瀏覽器不支援網頁全螢幕 API。');
        }
      } catch (error) {
        setStatus('無法進入全螢幕：' + (error.message || error));
      }
    });

    video.addEventListener('error', () => {
      setStatus('影片載入失敗。請確認網址是可直接播放的影片來源（例如 MP4/WebM），且伺服器允許瀏覽器存取。');
    });

    video.addEventListener('enterpictureinpicture', () => {
      setStatus('PiP 已開啟，可以切回手機主畫面。');
      updatePiPButton();
    });

    video.addEventListener('leavepictureinpicture', () => {
      setStatus('已退出 PiP。');
      updatePiPButton();
    });

    video.addEventListener('webkitpresentationmodechanged', () => {
      if (video.webkitPresentationMode === 'picture-in-picture') {
        setStatus('PiP 已開啟，可以切回手機主畫面。');
      } else {
        setStatus('已退出 PiP。');
      }
      updatePiPButton();
    });

    // 不在 visibilitychange/pagehide 時重建或清除播放器。
    // 手機切到背景再回來時，盡可能保留同一個 video / iframe 實例與播放位置。
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        if (pipBtn.dataset.mode === 'youtube') {
          setStatus('已回到播放器。YouTube 播放狀態會由原本的播放器實例繼續保留。');
        } else if (video.src) {
          setStatus(video.paused ? '已回到播放器，影片目前暫停。' : '已回到播放器，影片仍在播放。');
        }
      }
    });

    // 原生影片提供系統媒體控制；背景播放最終仍由手機瀏覽器/作業系統決定。
    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.setActionHandler('play', async () => {
          if (pipBtn.dataset.mode !== 'youtube') await video.play();
        });
        navigator.mediaSession.setActionHandler('pause', () => {
          if (pipBtn.dataset.mode !== 'youtube') video.pause();
        });
        navigator.mediaSession.setActionHandler('seekbackward', (details) => {
          if (pipBtn.dataset.mode !== 'youtube') video.currentTime = Math.max(0, video.currentTime - (details.seekOffset || 10));
        });
        navigator.mediaSession.setActionHandler('seekforward', (details) => {
          if (pipBtn.dataset.mode !== 'youtube') video.currentTime = Math.min(video.duration || Infinity, video.currentTime + (details.seekOffset || 10));
        });
      } catch (_) {}
    }

    video.addEventListener('play', () => {
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
    });
    video.addEventListener('pause', () => {
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    });

    window.addEventListener('beforeunload', () => {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
    });

    updatePiPButton();
  </script>
</body>
</html>
